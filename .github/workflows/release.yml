name: Release
# Push a tag like v0.1.0 to build and publish every image to GHCR and draft a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      TRACELUME_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lower-case registry owner
        run: echo "TRACELUME_REGISTRY=ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: App image (amd64 + arm64 for Apple Silicon / ARM Linux)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$TRACELUME_REGISTRY/tracelume/app:${GITHUB_REF_NAME#v}" \
            -t "$TRACELUME_REGISTRY/tracelume/app:0.1.0" .
      - name: Tool images (amd64; Docker Desktop on Apple Silicon runs them via emulation)
        run: |
          docker compose --profile tools build
          docker compose --profile tools push $(docker compose --profile tools config --services | grep -vE '^(api|worker|db|redis|docker-proxy|ollama)$')
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Install
            1. Install Docker Desktop (Windows/macOS) or Docker Engine (Linux).
            2. Download **Source code (zip)** below and unpack it.
            3. Run `./tracelume tools` once, then `./tracelume start`
               (Windows: `powershell -ExecutionPolicy Bypass -File .\tracelume.ps1 tools`, then `start`).
