name: Tool images
# Builds each forensic tool image and, where a test exists, runs it on synthetic or public
# sample evidence exactly as the worker does (no network, read-only evidence).
on:
  push:
    branches: [main]
    paths: ["plugins/**", "docker-compose.yml", ".github/workflows/tools.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: aleapp,         test: "aleapp and integration" }
          - { service: ileapp,         test: "" }
          - { service: sleuthkit,      test: "sleuthkit and integration" }
          - { service: sqlite-recover, test: "" }
          - { service: media,          test: "media and integration" }
          - { service: plaso,          test: "plaso and integration" }
          - { service: volatility3,    test: "" }
          - { service: hayabusa,       test: "windows_log_tools and hayabusa" }
          - { service: chainsaw,       test: "windows_log_tools and chainsaw" }
          - { service: evtx,           test: "windows_log_tools and evtx" }
          - { service: regripper,      test: "" }
          - { service: mftecmd,        test: "" }
          - { service: yara,           test: "yara_matches" }
          - { service: mvt,            test: "" }
          - { service: acquire-ios,    test: "" }
    env:
      TRACELUME_REGISTRY: ghcr.io/0xs3j4d
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.service }}
        run: docker compose --profile tools build ${{ matrix.service }}
      - name: Test fixtures
        if: matrix.test != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q dosfstools mtools
      - uses: astral-sh/setup-uv@v6
        if: matrix.test != ''
      - name: Run ${{ matrix.service }} on sample evidence
        if: matrix.test != ''
        run: |
          cd backend && uv venv -p 3.12 && uv pip install -e '.[dev]' pillow
          TRACELUME_INTEGRATION=1 .venv/bin/pytest -q ../plugins tests -k "${{ matrix.test }}" -rs
